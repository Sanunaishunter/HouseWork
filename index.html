<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家事紀錄表 HouseWork</title>
<link rel="icon" type="image/jpeg" href="img/logo.jpg">
<link rel="apple-touch-icon" href="img/apple-touch-icon.jpg">
<meta name="apple-mobile-web-app-title" content="HouseWork">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="password-corner" class="password-corner">
  <input id="lock-password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <span id="password-confirm" class="password-confirm hidden">✓</span>
</div>

<div class="app" id="appRoot">

  <header class="app-header">
    <div class="brand">
      <img src="img/logo.jpg" alt="HouseWork logo" class="brand-logo">
      <h1>家事紀錄表</h1>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="board">🧩 打卡看板</button>
    <button class="tab-btn" data-tab="history">📜 歷史紀錄</button>
    <button class="tab-btn" data-tab="stats">📊 統計摘要</button>
    <button class="tab-btn" data-tab="data">💾 資料管理</button>
  </nav>

  <main>

    <!-- BOARD TAB -->
    <section class="tab-panel active" id="panel-board">
      <div class="calendar-card">
        <div class="calendar-header">
          <button id="cal-prev" class="ghost-btn cal-nav-btn" title="上個月">‹</button>
          <div class="calendar-month-label" id="calendar-month-label"></div>
          <button id="cal-next" class="ghost-btn cal-nav-btn" title="下個月">›</button>
          <button id="cal-today-btn" class="ghost-btn">今天</button>
        </div>
        <div class="calendar-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"><!-- day cells injected --></div>
      </div>

      <div class="day-detail">
        <div class="day-detail-header">
          <h3 id="day-detail-title"></h3>
          <button id="add-task-btn" class="primary-btn">＋ 新增任務</button>
        </div>

        <div class="dropzone" id="dropzone">
          <div class="dropzone-placeholder" id="dropzone-placeholder">
            這天還沒有紀錄，點擊「＋ 新增任務」開始記錄吧！
          </div>
          <div class="board-entries" id="board-entries"></div>
        </div>

        <div class="palette-drawer" id="palette-drawer" hidden>
          <p class="hint">拖曳（或點擊）下方方塊，記錄到這天的看板上。「被罵」、「看病」方塊會請你留言備註。</p>
          <div class="palette" id="palette"><!-- chore blocks injected --></div>
        </div>
      </div>
    </section>

    <!-- HISTORY TAB -->
    <section class="tab-panel" id="panel-history">
      <div class="history-toolbar">
        <input type="text" id="history-search" placeholder="🔍 搜尋備註或項目...">
        <select id="history-filter">
          <option value="">全部項目</option>
        </select>
      </div>
      <div class="history-list" id="history-list"></div>
    </section>

    <!-- STATS TAB -->
    <section class="tab-panel" id="panel-stats">
      <div class="stats-summary" id="stats-summary"></div>
      <h3 class="stats-heading">近 7 天紀錄量</h3>
      <div class="stats-chart" id="stats-chart"></div>
      <h3 class="stats-heading">項目累計次數</h3>
      <div class="stats-bars" id="stats-bars"></div>
    </section>

    <!-- DATA TAB -->
    <section class="tab-panel" id="panel-data">
      <div class="data-card">
        <h3>匯出資料</h3>
        <p class="hint">匯出的檔案會下載到瀏覽器的下載資料夾，請手動移到專案的 <code>SaveData/</code> 資料夾保存。</p>
        <div class="btn-row">
          <button id="export-json" class="primary-btn">⬇️ 匯出 JSON</button>
          <button id="export-csv" class="primary-btn">⬇️ 匯出 CSV</button>
        </div>
      </div>
      <div class="data-card">
        <h3>匯入資料</h3>
        <p class="hint">從 <code>SaveData/</code> 資料夾選取先前匯出的 JSON 檔案來還原紀錄。</p>
        <input type="file" id="import-file" accept="application/json">
      </div>
      <div class="data-card danger-card">
        <h3>清除資料</h3>
        <p class="hint">清除瀏覽器內所有的家事紀錄，請先匯出備份！</p>
        <button id="clear-data" class="danger-btn">🗑️ 清除全部紀錄</button>
      </div>
      <div class="data-card">
        <h3>畫面鎖定</h3>
        <p class="hint">點擊「登出」會把整個看板收起來，變成空白畫面；資料不會被刪除，用右上角的隱藏熱區輸入密碼即可恢復。</p>
        <button id="logout-btn" class="ghost-btn">🚪 登出</button>
      </div>
    </section>

  </main>
</div>

<!-- Memo Modal -->
<div class="modal-backdrop" id="memo-modal">
  <div class="modal">
    <h3 id="memo-modal-title">📝 新增備註</h3>
    <textarea id="memo-input" rows="4" placeholder="寫下備註，例如：忘記倒垃圾被唸 / 感冒回診拿藥..."></textarea>
    <div class="btn-row">
      <button id="memo-cancel" class="ghost-btn">取消</button>
      <button id="memo-save" class="primary-btn">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
